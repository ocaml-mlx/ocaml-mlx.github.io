<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="{{description}}" />
    <title>{{title}}</title>
    {{canonical}}
    {{openGraph}}
    {{robots}}
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/geist-fonts.css" />
    <link rel="stylesheet" href="/assets/vite-reference-tokens.css" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="mlx home">mlx</a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/docs/" data-page-link="docs"{{docsActive}}>Documentation</a>
          <a href="/blog/" data-page-link="blog"{{blogActive}}>Blog</a>
        </nav>
        <div class="header-actions">
          <a href="https://opam.ocaml.org/packages/mlx/" target="_blank" rel="noopener noreferrer" aria-label="mlx on opam" title="mlx on opam"><img src="/assets/brands/opam-monochrome.png" alt="" width="24" height="24" /></a>
          <a href="https://github.com/ocaml-mlx/mlx" target="_blank" rel="noopener noreferrer" aria-label="mlx on GitHub" title="mlx on GitHub"><img src="/assets/brands/github.svg" alt="" width="24" height="24" /></a>
        </div>
      </div>
    </header>
    <main id="content" tabindex="-1">{{content}}</main>
  </body>
</html>
